                            {
                                "@type": "Question",
                                "name": "What is Minecraft Item Search?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "Minecraft Item Search is an instant, browser-based lookup tool and comprehensive database for every item, block, tool, entity drop, and game mechanic in Minecraft. Everything runs instantly with zero load time as you type."

                            },
                            {
                                "@type": "Question",
                                "name": "How do I search for items using keyboard shortcuts?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "Press Ctrl+K (or Cmd+K on Mac) anywhere on the page to focus the search bar. Use the up and down arrow keys to navigate suggestions, and press Enter to open the complete stats panel. Press Esc to exit search."
                                }
                            },
                            {
                                "@type": "Question",
                                "name": "What information can I look up for each item?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "Each item page provides block properties (hardness, blast resistance, light level, harvest tools), item and combat stats (attack damage, armor, durability, enchantability), crafting and smelting recipes, loot tables (chests, trial vaults), natural biome generation, mob drops, and villager trades."
                                }
                            },
                            {
                                "@type": "Question",
                                "name": "Which Minecraft versions are supported?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "The database is updated for Minecraft 26.2 and earlier releases. You can switch between supported versions at any time using the version selector in the top navigation bar."
                                }
                            },
                            {
                                "@type": "Question",
                                "name": "How do I build and export a custom item list?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "Click on the Custom List tab in the navigation bar. Developers can filter and query the catalog by renewability, rarity, harvest tools, biomes, or dimensions, then export formatted lists of item IDs or properties for configurations, plugins, and tools."
                                }
                            },
                            {
                                "@type": "Question",
                                "name": "Can I download the entire database as JSON?",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "Yes. Click the Download List button in the top bar to download the full version-specific database in standardized JSON format for your own mods, plugins, bots, or development projects."
